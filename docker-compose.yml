version: '3.9'

services:
  django:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - payments

  payments:
    build: ./payments-service
    ports:
      - "5001:5001"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - django
      - payments